version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "King@112005"
      POSTGRES_DB: ponto_digital
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:King%40112005@db:5432/ponto_digital
      - JWT_SECRET_KEY=super_secret_key_change_me_in_prod
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy

  web_admin:
    build:
      context: ./web_admin
    ports:
      - "5173:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
