apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ponto-digital-ingress
  namespace: ponto-digital
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Redireciona o tráfego HTTP para HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Aumenta limite de tamanho do corpo para eventuais uploads ou chamadas pesadas
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  # Descomente e configure a seção 'tls' após aplicar certificados via Cert-Manager
  # tls:
  #   - hosts:
  #       - ponto.lablivre.com
  #     secretName: ponto-tls-cert
  rules:
    - host: ponto.lablivre.com
      http:
        paths:
          # Roteamento para a API do backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
          # Roteamento padrão para o frontend React
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
