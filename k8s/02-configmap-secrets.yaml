apiVersion: v1
kind: ConfigMap
metadata:
  name: ponto-digital-config
  namespace: ponto-digital
data:
  ENVIRONMENT: "production"
  # URL do Supabase ou banco externo
  DATABASE_URL: "postgresql+asyncpg://seu-user:sua-senha@aws-0-sa-east-1.pooler.supabase.com:6543/postgres"

---
apiVersion: v1
kind: Secret
metadata:
  name: ponto-digital-secrets
  namespace: ponto-digital
type: Opaque
stringData:
  JWT_SECRET_KEY: "super_secret_key_change_me_in_prod"
  # Opcional: Se preferir colocar a connection string direto aqui em base64/stringData para maior segurança
  # DB_PASSWORD: "sua_senha_supabase"
