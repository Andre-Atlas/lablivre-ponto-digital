[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ponto-digital-client"
version = "0.1.0"
description = "Cliente desktop Flet para registro de ponto de residentes"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Equipe Ponto Digital" },
]
dependencies = [
    "flet>=0.25",
    "httpx>=0.27",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
ponto-digital = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
