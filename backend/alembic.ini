# Configuração padrão do Alembic para o Ponto Digital

[alembic]
# Caminho para os scripts de migração
script_location = migrations

# Adiciona o diretório atual ao sys.path para resolução de módulos
prepend_sys_path = .

# Separador de caminho de versão
version_path_separator = os

# Formato do nome do arquivo de migração (ex: 2026_09_24_1000-rev_slug.py)
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# URL do banco de dados (sobrescrita dinamicamente em migrations/env.py a partir das configurações da aplicação)
sqlalchemy.url = postgresql+asyncpg://postgres:King%%40112005@localhost:5432/ponto_digital

[post_write_hooks]
# Hooks executados após a criação de um script de migração (ex: formatação com ruff)
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Configurações de Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
