name: Web Admin CI

on:
  push:
    branches:
      - main
    paths:
      - 'web_admin/**'
      - '.github/workflows/ci-web-admin.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web_admin/**'
      - '.github/workflows/ci-web-admin.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build & Lint (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web_admin/package-lock.json

      - name: Install Dependencies
        working-directory: ./web_admin
        run: npm ci

      - name: Type Check
        working-directory: ./web_admin
        run: npm run typecheck || npx tsc --noEmit

      - name: Build Web Admin
        working-directory: ./web_admin
        run: npm run build
