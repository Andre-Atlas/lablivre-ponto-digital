name: Release Client Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Empacotar (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os_name: macOS (ARM64)
            asset_ext: tar.gz
            asset_mime: application/gzip
            target_slug: macos-arm64
          - os: ubuntu-latest
            os_name: Linux (x86_64)
            asset_ext: tar.gz
            asset_mime: application/gzip
            target_slug: linux-x64
          - os: windows-latest
            os_name: Windows (x86_64)
            asset_ext: zip
            asset_mime: application/zip
            target_slug: windows-x64

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libmpv-dev

      - name: Instalar dependências Python do Client
        working-directory: ./client
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flet pyinstaller

      - name: Executar Build Desktop (macOS / Linux)
        if: runner.os != 'Windows'
        working-directory: ./client
        run: |
          mkdir -p dist
          # Build via PyInstaller / Flet CLI
          if [ -f "scripts/build.sh" ]; then
            bash scripts/build.sh
          else
            flet pack src/ui/main.py --name "PontoResidencia" --distpath dist/PontoResidencia
          fi
          
          # Compactar pacote para distribuição
          cd dist
          tar -czf "PontoResidencia-${{ github.ref_name }}-${{ matrix.target_slug }}.${{ matrix.asset_ext }}" *

      - name: Executar Build Desktop (Windows)
        if: runner.os == 'Windows'
        working-directory: ./client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if (Test-Path "scripts\build.ps1") {
            powershell -File scripts\build.ps1
          } else {
            flet pack src\ui\main.py --name "PontoResidencia" --distpath dist\PontoResidencia
          }
          
          # Compactar pacote para distribuição
          Compress-Archive -Path dist\PontoResidencia\* -DestinationPath "dist\PontoResidencia-${{ github.ref_name }}-${{ matrix.target_slug }}.${{ matrix.asset_ext }}"

      - name: Publicar Binário na GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: client/dist/PontoResidencia-${{ github.ref_name }}-${{ matrix.target_slug }}.${{ matrix.asset_ext }}
          generate_release_notes: true
          draft: false
          prerelease: false
