# ==============================================================================
# Google Cloud Build — Pipeline de CI/CD para o Backend (Cloud Run & Alembic)
# ==============================================================================
# Este pipeline realiza:
# 1. Build da imagem Docker da API Backend
# 2. Push da imagem com tags SHA e 'latest' no Google Container / Artifact Registry
# 3. Execução de migrações do banco de dados relacional via Alembic
# 4. Deploy contínuo e com zero downtime para o Google Cloud Run
# ==============================================================================

timeout: '1200s' # 20 minutos

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

substitutions:
  _PROJECT_ID: 'ponto-residencia-prod'
  _REGION: 'southamerica-east1'
  _SERVICE_NAME: 'ponto-backend'
  _DB_SECRET_NAME: 'ponto-database-url'
  _INSTANCE_CONNECTION_NAME: 'ponto-residencia-prod:southamerica-east1:ponto-db'

steps:
  # ----------------------------------------------------------------------------
  # Etapa 1: Build da imagem Docker com cache
  # ----------------------------------------------------------------------------
  - id: 'docker-build'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '-t'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:latest'
      - '-f'
      - 'backend/Dockerfile'
      - './backend'

  # ----------------------------------------------------------------------------
  # Etapa 2: Push das imagens para o Container Registry
  # ----------------------------------------------------------------------------
  - id: 'docker-push-sha'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:${SHORT_SHA}'

  - id: 'docker-push-latest'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:latest'

  # ----------------------------------------------------------------------------
  # Etapa 3: Executar Migrações do Banco de Dados via Alembic
  # Utiliza a imagem recém-gerada conectando-se ao Cloud SQL via Cloud SDK / Proxy
  # ----------------------------------------------------------------------------
  - id: 'run-alembic-migrations'
    name: 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:${SHORT_SHA}'
    entrypoint: '/bin/sh'
    args:
      - '-c'
      - |
        echo "Iniciando migrações com Alembic..."
        alembic upgrade head
        echo "Migrações concluídas com sucesso!"
    secretEnv: ['DATABASE_URL']

  # ----------------------------------------------------------------------------
  # Etapa 4: Deploy no Google Cloud Run
  # ----------------------------------------------------------------------------
  - id: 'deploy-cloud-run'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8000'
      - '--cpu=2'
      - '--memory=1Gi'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--add-cloudsql-instances=${_INSTANCE_CONNECTION_NAME}'
      - '--set-secrets=DATABASE_URL=${_DB_SECRET_NAME}:latest'
      - '--labels=managed-by=cloudbuild,app=ponto-residencia,env=production'

# ------------------------------------------------------------------------------
# Resolução de Segredos via Secret Manager
# ------------------------------------------------------------------------------
availableSecrets:
  secretManager:
    - versionName: 'projects/${_PROJECT_ID}/secrets/${_DB_SECRET_NAME}/versions/latest'
      env: 'DATABASE_URL'

# ------------------------------------------------------------------------------
# Imagens geradas e registradas no build
# ------------------------------------------------------------------------------
images:
  - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:${SHORT_SHA}'
  - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:latest'
